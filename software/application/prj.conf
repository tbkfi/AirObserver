# Wi-Fi Configuration
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y

# Network Configuration
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_IPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NETWORKING=y

# BME*** & SCD*** need those
CONFIG_I2C=y
CONFIG_GPIO=y
###CONFIG_SENSOR=y
###CONFIG_SCD4X=y
###CONFIG_BME690=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_I2C_SHELL=y

# LOG Configuration
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_DBG=y

# Enable display
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_SSD16XX=y

# Enable Display Subsystem
CONFIG_DISPLAY=y

# Enable SSD16xx driver
CONFIG_SSD16XX=y

CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y

# CONFIG_CPLUSPLUS=y
CONFIG_HTTP_CLIENT=y

services:
  db:
    image: postgres:18-alpine
    container_name: sniffer_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wordaSS1!
    volumes:
      - ../db/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/pgsql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    container_name: api_server
    build:
      context: ..
      dockerfile: docker/compose.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:wordaSS1!@db:5432/airsniffs
      - PORT=3000
      - DB_USERNAME=postgres
      - DB_PASSWORD=wordaSS1!
      #- DB_USERNAME=airsniffer
      #- DB_PASSWORD=sniff3r3r
      - DB_DOMAIN=db
      - DB_PORT=5432
      - DB_NAME=airsniffs
    tty: true
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

